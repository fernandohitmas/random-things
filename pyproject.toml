[project]
name = "random-things"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fernando Masumoto", email = "fernando.masumoto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "ipython>=9.17.1",
    "marimo>=0.25.1",
    "mcp>=2.3.0",
    "numpy>=2.5.3",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "vega-datasets>=0.9.0",
]

[project.scripts]
random-things = "random_things:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
